name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: unzip -q UniqueEnchantsMod-Fabric-1.21.11.zip -d work
      - working-directory: work/UniqueEnchantsMod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: uniqueenchants-mod
          path: work/UniqueEnchantsMod/build/libs/uniqueenchants-1.0.0.jar
